<!doctype html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tryoutku Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.48.0/dist/tabler-icons.min.css" />
<style>
  /* UI tokens (flat, no gradient). Fonts: Inter for body/UI, Poppins for display/headings. Icons: Tabler Icons.
     Accent = student app primary scale (light: #1D4ED8 family / dark: #3B82F6 family). All accents use var(--primary). */
  :root{
    color-scheme:light;
    --primary:#1D4ED8; --primary-hover:#1E40AF; --primary-50:#EFF6FF; --primary-100:#DBEAFE;
    --primary-200:#BFDBFE; --primary-300:#93C5FD; --primary-400:#60A5FA; --primary-500:#2563EB; --primary-600:#1D4ED8;
    --secondary:#16A34A; --secondary-100:#DCFCE7;
    --gold:#F59E0B; --orange:#F97316; --pink:#EC4899; --red:#EF4444;
    --bg-page:#F8FAFC; --bg-card:#FFFFFF; --bg-hover:#F1F5F9; --bg-input:#FFFFFF;
    --bg-sidebar:#FFFFFF; --bg-content:#FFFFFF;
    --text-h:#0F172A; --text-1:#0F172A; --text-2:#475569; --text-3:#94A3B8;
    --border:#D8E0EC; --border-soft:#E6ECF3;
    --ring:#93C5FD; --danger:#EF4444;
    --r-card:16px; --r-btn:12px; --r-input:12px; --r-float:24px;
    /* Single z-scale. Higher paints above. Dropdown lives inside topbar, drawer above scrim, palette above drawer, toast above all. */
    --z-topbar:40; --z-moboverlay:45; --z-sidebar:50;
    --z-scrim:70; --z-drawer:71; --z-pal:80; --z-toast:90;
    --z-modal:85;
    --shadow-sm:0 1px 2px rgba(15,23,42,.08),0 1px 3px rgba(15,23,42,.05);
    --shadow-md:0 4px 14px rgba(15,23,42,.08);
    --sb-w:232px; --sb-wc:76px; --top-h:64px;
    --content-width:1280px;
  }
  [data-theme="dark"]{
    color-scheme:dark;
    --primary:#3B82F6; --primary-hover:#60A5FA; --primary-50:#172554; --primary-100:#1E3A8A;
    --primary-200:#1E40AF; --primary-300:#1D4ED8; --primary-400:#60A5FA; --primary-500:#3B82F6; --primary-600:#2563EB;
    --secondary:#22C55E; --secondary-100:#14532D;
    --bg-page:#0D0E10; --bg-card:#1A1B1E; --bg-hover:#22242A; --bg-input:#0D0E10;
    --bg-sidebar:#111214; --bg-content:#1A1B1E;
    --text-h:#F2F3F5; --text-1:#DBDEE1; --text-2:#B5BAC1; --text-3:#72767E;
    --border:#272A34; --border-soft:#1A1B1E;
    --ring:#5865F2; --danger:#F23F43;
    --shadow-sm:none; --shadow-md:none;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg-page);color:var(--text-1);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit}
  h1,h2,h3,.hero h1,.card-h h2,.drawer-h h3,.kpi .val{font-family:Poppins,Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  h1,h2,h3,b,strong{font-weight:600}
  /* Tabler Icons base */
  .ti{font-size:20px;line-height:1;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle}
  @font-face{font-family:"tabler-icons-filled";font-style:normal;font-weight:400;
    src:url("https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.48.0/dist/fonts/tabler-icons-filled.woff2?v3.48.0") format("woff2"),url("https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.48.0/dist/fonts/tabler-icons-filled.woff?v3.48.0") format("woff")}
  .ti-f{font-family:"tabler-icons-filled" !important;font-style:normal;font-weight:normal;font-variant:normal;text-transform:none;speak:none;font-size:20px;line-height:1;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  .ti-f-book:before{content:"\fa87";}
  .ti-f-adc:before{content:"\f7d3";}
  .ti-f-user:before{content:"\fd19";}
  .ti-f-shield:before{content:"\f761";}
  .ni .ti{font-size:24px;flex:0 0 24px}
  .iconbtn .ti{font-size:22px;display:block}
  #roleBtn .ti,.ctx-pop .ti,#roleBtn .ti-f,.ctx-pop .ti-f{font-size:16px}
  .qi .ti,.tick .ti{display:block;font-size:17px}
  .tick .ti{font-size:14px}
  .toast-item .ti{flex:0 0 16px;margin-top:2px;font-size:16px}
  .empty .eico .ti{display:block;font-size:24px}
  .who-ava,.ev-ava,.ava,.ctx-ic,.qi{font-family:Poppins,Inter,system-ui,sans-serif}
  :focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:8px}
  ::selection{background:var(--primary);color:#fff}
  .app{display:flex;min-height:100vh;gap:0}

  /* Skip link */
  .skip{position:fixed;left:12px;top:-60px;z-index:200;background:var(--text-h);color:var(--bg-card);
    padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;transition:top .15s ease;text-decoration:none}
  .skip:focus{top:12px}

  /* Sidebar: docked panel, edges touch viewport (no floating margin) */
  .sidebar{width:var(--sb-w);position:fixed;left:0;top:0;bottom:0;
    background:var(--bg-sidebar);border:0;border-right:1px solid var(--border);
    border-radius:0;display:flex;flex-direction:column;z-index:var(--z-sidebar);overflow:hidden;
    transition:width .2s ease,transform .25s ease}
  body.collapsed .sidebar{width:var(--sb-wc)}
  /* brand removed: role dropdown sits at the top of the sidebar */
  .ctx{margin:12px 12px 8px;position:relative}
  #roleBtn{width:100%;min-height:44px;display:flex;align-items:center;gap:10px;border:1px solid var(--border);
    background:var(--bg-hover);border-radius:12px;padding:0 12px;cursor:pointer;font-weight:600;color:var(--text-h);
    font-size:13px;font-family:inherit}
  #roleBtn:hover{background:var(--bg-hover)}
  #roleBtn .ctx-ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:0 0 28px}
  #roleBtn .ctx-ic .ti,#roleBtn .ctx-ic .ti-f{color:#fff;opacity:1;font-size:15px}
  #roleBtn .ctx-lbl{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #roleBtn .chev{display:inline-flex;flex:0 0 16px;color:var(--text-3)}
  #roleBtn .chev .ti{font-size:16px}
  body.collapsed .ctx{display:block;margin:12px 8px 6px}
  body.collapsed #roleBtn{justify-content:center;padding:0}
  body.collapsed #roleBtn .ctx-lbl,body.collapsed #roleBtn .chev{display:none}
  body.collapsed .sidebar{overflow:visible}
  body.collapsed .ctx-pop{left:calc(100% + 10px);top:0;right:auto;width:250px}
  .ctx-pop{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--bg-card);border:1px solid var(--border);
    border-radius:14px;box-shadow:var(--shadow-md);padding:6px;display:none;z-index:5}
  .ctx-pop.show{display:block}
  .ctx-pop button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;
    padding:9px 10px;border-radius:10px;cursor:pointer;min-height:52px}
  .ctx-pop button:hover{background:var(--bg-hover)}
  .ctx-pop button.on{background:var(--primary-50)}
  .ctx-pop .ctx-ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:0 0 30px}
  .ctx-pop .ctx-ic .ti,.ctx-pop .ctx-ic .ti-f{color:#fff;opacity:1}
  .ctx-pop b{font-size:12.5px;display:block;color:var(--text-h);line-height:1.3}
  .ctx-pop small{font-size:11px;color:var(--text-2)}
  .ctx-pop .tickok{margin-left:auto;color:var(--primary);flex:0 0 16px}
  .nav{flex:1;overflow-y:auto;padding:2px 10px 10px;scrollbar-width:thin;overscroll-behavior:contain}
  .nav-title{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    color:var(--text-3);padding:14px 10px 6px}
  body.collapsed .nav-title{font-size:0;padding:10px 12px 6px}
  body.collapsed .nav-title::after{content:"";display:block;height:1px;background:var(--border-soft);border-radius:1px}
  .ni{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;text-align:left;border:0;
    background:transparent;color:var(--text-2);padding:0 12px;border-radius:12px;cursor:pointer;
    font-weight:500;font-size:13.5px}
  .ni .ti{opacity:.7}
  .ni:hover{background:var(--bg-hover);color:var(--text-h)}
  .ni:hover .ti{opacity:1}
  .ni.active{background:var(--primary-50);color:var(--text-h);font-weight:600}
  .ni.active .ti{opacity:1}
  body.collapsed .ni{justify-content:center;padding:0}
  body.collapsed .ni .lbl,body.collapsed .ni .bdg{display:none}
  .ni .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ni.sub{padding-left:24px;min-height:40px;font-size:12.8px}
  .bdg{font-size:10px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;
    background:var(--bg-hover);color:var(--text-2)}
  .bdg.dot{width:8px;height:8px;min-width:8px;padding:0;border-radius:50%;flex:0 0 8px}
  .ni.active .bdg{background:var(--bg-card)}
  .bdg.warn{background:#FEF3C7;color:#B45309}
  .bdg.alert{background:#FEE2E2;color:#B91C1C}
  .bdg.ok{background:#DCFCE7;color:#15803D}
  .bdg.info{background:var(--primary-100);color:var(--primary)}
  [data-theme="dark"] .bdg.warn{background:rgba(245,158,11,.15);color:#FBBF24}
  [data-theme="dark"] .bdg.alert{background:rgba(242,63,67,.15);color:#F87171}
  [data-theme="dark"] .bdg.ok{background:rgba(34,197,94,.15);color:#4ADE80}
  [data-theme="dark"] .bdg.info{background:rgba(59,130,246,.18);color:#93C5FD}
  .sb-foot{border-top:1px solid var(--border-soft);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
  .sb-user{position:relative}
  #userBtn{width:100%;display:flex;align-items:center;gap:10px;padding:8px;border:1px solid transparent;
    background:transparent;border-radius:12px;cursor:pointer;min-height:52px;text-align:left;font-family:inherit;color:inherit}
  #userBtn:hover{background:var(--bg-hover)}
  #userBtn .ava.sm{width:36px;height:36px;font-size:12px;flex:0 0 36px}
  #userBtn .uinfo{flex:1;min-width:0;line-height:1.35}
  #userBtn .uinfo b{display:block;font-size:13px;color:var(--text-h);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #userBtn .uinfo small{color:var(--text-3);font-size:11.5px}
  #userBtn>.ti{color:var(--text-3);font-size:15px;flex:0 0 15px;transition:transform .2s ease,color .15s ease}
  #userBtn:hover>.ti{color:var(--text-h)}
  .sb-user:has(.user-pop.show) #userBtn>.ti{transform:rotate(180deg);color:var(--text-h)}
  body.collapsed #userBtn{justify-content:center;padding:8px 0}
  body.collapsed #userBtn .uinfo,body.collapsed #userBtn>.ti{display:none}
  .user-pop{position:absolute;bottom:calc(100% + 8px);left:0;right:0;background:var(--bg-card);border:1px solid var(--border);
    border-radius:14px;box-shadow:var(--shadow-md);padding:6px;display:none;z-index:5}
  .user-pop.show{display:block}
  .user-pop button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;
    padding:10px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text-1);min-height:44px}
  .user-pop button:hover{background:var(--bg-hover)}
  .user-pop button .ti{font-size:17px;color:var(--text-2)}
  body.collapsed .logout-btn span{display:none}
  body.collapsed .logout-btn{justify-content:center;padding:0}
  .logout-btn{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;
    background:transparent;border-radius:10px;min-height:36px;width:100%;cursor:pointer;color:var(--danger);
    font-size:12px;font-weight:600;font-family:inherit}
  .logout-btn .ti{font-size:18px}
  .logout-btn:hover{background:rgba(239,68,68,.1);border-color:transparent}
  .logout-ov{position:fixed;inset:0;z-index:var(--z-pal);background:var(--bg-page);display:none;align-items:center;justify-content:center}
  .logout-ov.show{display:flex}
  .logout-card{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
  .logout-card .ava{width:56px;height:56px;font-size:18px;cursor:default}
  .logout-card b{font-size:16px;color:var(--text-h)}
  .logout-card span{font-size:12px;color:var(--text-3)}
  .logout-card p{margin:0 0 10px;font-size:13px;color:var(--text-2)}

  /* Main */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;margin-left:var(--sb-w);transition:margin-left .2s ease}
  body.collapsed .main{margin-left:var(--sb-wc)}
  .top{position:sticky;top:0;z-index:var(--z-topbar);min-height:var(--top-h);display:flex;align-items:center;gap:10px;
    padding:10px 24px;background:var(--bg-page);border-bottom:1px solid var(--border-soft)}
  .iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--bg-card);
    display:grid;place-items:center;cursor:pointer;color:var(--text-2);position:relative;flex:0 0 40px}
  .iconbtn:hover{color:var(--text-h);border-color:var(--primary)}
  #menuBtn{background:none;border:0;box-shadow:none;width:40px;height:40px;border-radius:10px;
    display:grid;place-items:center;cursor:pointer;color:var(--text-2);flex:0 0 40px}
  #menuBtn:hover{color:var(--primary);background:var(--bg-hover)}
  .iconbtn .ping{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;
    background:var(--danger);border:2px solid var(--bg-card)}
  .crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-3);white-space:nowrap}
  .crumbs b{color:var(--text-h);font-weight:600}
  .crumbs button{background:none;border:0;color:var(--text-3);cursor:pointer;font-size:13px;padding:2px 4px;border-radius:6px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
  .crumbs button:hover{color:var(--primary)}
  .crumbs .cur{color:var(--text-h);font-weight:600;display:inline-flex;align-items:center;gap:6px}
  .crumbs .cur .ti,.crumbs button .ti{font-size:15px}
  .crumbs .sep{display:inline-flex;color:var(--text-3)}
  .crumbs .sep .ti{font-size:14px}
  .btn .ti,.link .ti,.mini-btn .ti{font-size:17px}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .searchtrig{display:flex;align-items:center;gap:8px;min-height:40px;min-width:200px;padding:0 12px;border:1px solid var(--border);
    background:var(--bg-card);border-radius:12px;cursor:pointer;color:var(--text-3);font-size:13px}
  .searchtrig:hover{border-color:var(--primary);color:var(--text-2)}
  .searchtrig .ti{font-size:17px}
  .searchtrig kbd{margin-left:auto}
  kbd,.kbd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;background:var(--bg-hover);
    border:1px solid var(--border);border-bottom-width:2px;padding:1px 6px;border-radius:6px;color:var(--text-2);white-space:nowrap}
  .ava{width:40px;height:40px;border-radius:50%;background:var(--secondary);display:grid;place-items:center;
    color:#fff;font-weight:600;flex:0 0 40px;font-size:13px;border:0;cursor:pointer;font-family:inherit}
  button.ava:hover{box-shadow:0 0 0 2px var(--ring)}
  .wrap{padding:24px;max-width:var(--content-width);width:100%;margin:0 auto}
  @media(min-width:1280px){.wrap{padding:28px 30px}}

  .hero{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px;flex-direction:column}
  .hero h1{margin:0;font-size:20px;color:var(--text-h);letter-spacing:-.01em}
  .hero p{margin:5px 0 0;color:var(--text-2);max-width:760px;font-size:13.5px}
  .hero-actions{margin-left:0;display:flex;gap:8px;flex-wrap:wrap;width:100%;justify-content:flex-end}
  .btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--border);
    background:var(--bg-card);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;
    gap:8px;font-size:13.5px;color:var(--text-h);box-shadow:var(--shadow-sm);
    transition:background .2s ease,transform .15s ease}
  .btn:hover{border-color:var(--primary)}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn.primary:hover{background:var(--primary-hover)}
  .btn.danger{background:rgba(239,68,68,.1);border-color:transparent;color:#B91C1C}
  [data-theme="dark"] .btn.danger{background:rgba(242,63,67,.15);color:#F87171}
  .btn.sm{min-height:36px;padding:0 12px;font-size:12.5px;border-radius:10px}
  .btn:disabled{opacity:.5;cursor:default}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
  /* 3-card variant (marketing): always fills the row, no empty slot at the right. */
  .kpis.k3{grid-template-columns:repeat(3,1fr)}
  @media (max-width:760px){.kpis.k3{grid-template-columns:1fr}}
  .kpi{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-card);
    padding:15px;box-shadow:var(--shadow-sm);text-align:left;font-family:inherit;width:100%}
  button.kpi{cursor:pointer}
  button.kpi:hover{border-color:var(--primary)}
  .kpi .kh{display:flex;align-items:center;gap:9px}
  .kpi .lbl{font-size:12px;color:var(--text-2);font-weight:600}
  .kpi .vrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:7px}
  .kpi .val{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:6px 0 2px;color:var(--text-h);line-height:1.1}
  .kpi .sub{display:flex;align-items:center;gap:7px;font-size:11.8px;color:var(--text-2);margin-top:5px}
  .kpi .sub.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--text-3);flex:0 0 6px}
  .kpi.up .sub.dot::before{background:var(--secondary)}
  .kpi.down .sub.dot::before{background:var(--danger)}
  .delta{font-size:9.5px;font-weight:600;padding:1px 7px;border-radius:999px;display:inline-flex;gap:4px;line-height:1.5}
  .delta.up{background:var(--secondary-100);color:var(--secondary)}
  .delta.down{background:#FEE2E2;color:#B91C1C}
  [data-theme="dark"] .delta.down{background:rgba(242,63,67,.15);color:#F87171}
  .delta.flat{background:var(--bg-hover);color:var(--text-2)}

  .grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;margin-bottom:14px}
  .card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-card);
    box-shadow:var(--shadow-sm);overflow:hidden;min-width:0}
  .card-h{display:flex;align-items:center;gap:10px;padding:15px 16px;border-bottom:1px solid var(--border-soft);min-height:60px}
  .card-h>div:first-child{display:flex;align-items:center;min-height:30px}
  .card-h h2{margin:0;font-size:14px;color:var(--text-h);line-height:1.4}
  .card-h p{margin:2px 0 0;font-size:12px;color:var(--text-2)}
  .card-h .sp{margin-left:auto;display:flex;gap:6px;align-items:center;flex:0 0 auto}
  /* Card tools: same language as .mini-btn/.chip — bordered, blue on hover, dark when on */
  .link{font-size:12.5px;font-weight:600;color:var(--text-2);background:var(--bg-card);
    border:1px solid var(--border);cursor:pointer;padding:0 12px;border-radius:10px;white-space:nowrap;
    min-height:36px;display:inline-flex;align-items:center;gap:6px}
  .link:hover{border-color:var(--primary);color:var(--primary)}
  .link.on{background:var(--primary);border-color:var(--primary);color:#fff}
  .link.plain{background:none;border:0;padding:4px 6px;min-height:30px}
  /* Header Reset reserves its slot when inactive so the card header / table layout never shifts when it appears. */
  .link.reset-hidden{visibility:hidden;pointer-events:none}
  .seg{display:flex;gap:4px;background:var(--bg-hover);border-radius:10px;padding:3px}
  .seg button{border:0;background:none;border-radius:8px;padding:5px 11px;font-size:12px;font-weight:600;
    color:var(--text-2);cursor:pointer;min-height:30px}
  .seg button.on{background:var(--primary);color:#fff}
  .chart{padding:6px 16px 14px}
  .chart svg{width:100%;height:auto;display:block}
  .chart-legend{display:flex;gap:14px;flex-wrap:wrap;padding:0 16px 12px;font-size:12px;color:var(--text-2)}

/* Role -> visible nav keys. Admin sees all. Media is read-only for Tim Soal. */
var ACCESS={
 soal:['dashboard','questions','content-areas','topics','programs','blueprints','blueprint-versions','drills','tryouts','grading','question-reports','media','notifications'],
 marketing:['dashboard','ads','social-media','notifications','media','streak-tasks'],
 user:['dashboard','users','data-pelajar','invitations','notifications'],
 admin:'*'
};
function coveredKeys(){var s={};['soal','marketing','user'].forEach(function(r){(ACCESS[r]||[]).forEach(function(k){s[k]=1;});});return s;}
function navVisible(role){
 if(role==='admin'){
  /* Admin opens everything, so its sidebar lists only what no other role has.
     Team pages stay one click away via the role switcher. Dashboard always stays. */
  var cov=coveredKeys();var out=[];
  NAV.forEach(function(gr){
   var items=[];
   gr.items.forEach(function(it){
    if(it.k==='settings')return;
    if(it.children){
     var kids=it.children.filter(function(c){return !cov[c.k];});
     if(kids.length)items.push({g:it.t,items:kids});
    }else if(it.k==='dashboard'||!cov[it.k])items.push(it);
   });
   if(items.length)out.push({g:gr.g,items:items});
  });
  return out;
 }
 var out=[];
 NAV.forEach(function(gr){
  var items=[];
  gr.items.forEach(function(it){
   if(it.children){
    var kids=it.children.filter(function(c){return ACCESS[role].indexOf(c.k)>=0;});
    if(kids.length)items.push({g:it.t,items:kids});
    else if(ACCESS[role].indexOf(it.k)>=0)items.push(it);
   }else if(ACCESS[role].indexOf(it.k)>=0)items.push(it);
  });
  if(items.length)out.push({g:gr.g,items:items});
 });
 return out;
}
function flatNav(role){
 var out=[];
 navVisible(role).forEach(function(gr){gr.items.forEach(function(it){
  if(it.items)it.items.forEach(function(c){c.g=gr.g+' · '+it.t;out.push(c);});else{it.g=gr.g;out.push(it);}});});
 return out;
}

function areaChart(data,labels){
 var W=560,H=150,P=8;var max=Math.max.apply(null,data.concat([10]));
 var pts=data.map(function(v,i){var x=P+i*(W-2*P)/(data.length-1);var y=H-P-(v/max)*(H-2*P);return [x,y];});
 var line=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ');
 var area=line+'L'+(W-P)+' '+(H-P)+'L'+P+' '+(H-P)+'Z';
 var dots=pts.map(function(p){return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.2" fill="var(--primary)"/>';}).join('');
 var grid='';for(var g=1;g<=3;g++){var gy=(H*g/4);grid+='<line x1="'+P+'" y1="'+gy+'" x2="'+(W-P)+'" y2="'+gy+'" stroke="var(--border-soft)" stroke-width="1"/>';}
 return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Grafik aktivitas 7 hari">'+grid+'<path d="'+area+'" fill="var(--primary-100)" opacity=".55"/><path d="'+line+'" fill="none" stroke="var(--primary)" stroke-width="2.4" stroke-linecap="round"/>'+dots+'</svg>';
}

 $('#modalOv').classList.add('show');
 $('#mCancel').onclick=closeModal;
 $('#mOk').onclick=function(){
  var vals={},ok=true,firstBad=null;
  (o.fields||[]).forEach(function(f){
   var el=$('#mf-'+f.k);var v=el?el.value.trim():'';
   var err=$('#mfe-'+f.k);var msg='';
   if(f.req&&!v)msg=esc(f.l)+' wajib diisi.';
   else if(v&&f.type==='email'&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v))msg='Format email tidak valid. Contoh: nama@sekolah.sch.id.';
   else if(v&&f.type==='number'&&!/^\d+$/.test(v))msg='Hanya angka yang diperbolehkan.';
   if(err){err.textContent=msg;err.classList.toggle('show',!!msg);}
   if(el)el.classList.toggle('bad',!!msg);
   if(msg){ok=false;if(!firstBad)firstBad=el;}
   vals[f.k]=v;
  });
  if(!ok){if(firstBad)firstBad.focus();return;}
  closeModal();o.onSubmit(vals);
 };
  var f0=$('#modalBox').querySelector('input,select,textarea');if(f0)f0.focus();else{var fb=$('#mCancel');if(fb)fb.focus();}
}

$('#palInput').addEventListener('keydown',function(e){
 var items=($('#palList')._items)||[];
 if(e.key==='ArrowDown'){e.preventDefault();state.palIdx=Math.min(items.length-1,state.palIdx+1);paintPal(e.target.value);}
 else if(e.key==='ArrowUp'){e.preventDefault();state.palIdx=Math.max(0,state.palIdx-1);paintPal(e.target.value);}
 else if(e.key==='Enter'){palGo(items[state.palIdx]);}
});

document.addEventListener('keydown',function(e){
 var typing=document.activeElement&&(document.activeElement.tagName==='INPUT'||document.activeElement.tagName==='SELECT'||document.activeElement.tagName==='TEXTAREA');
 if(selCur){if(e.key==='Escape'){e.preventDefault();closeSelPop();}return;}
 if(e.key==='Escape'){
  if($('#palOv').classList.contains('show'))closePal();
  else if($('#modalOv').classList.contains('show'))closeModal();
  else{var kp2=$('#kebabPop');if(kp2)kp2.classList.remove('show');closeDrawer();var rp=$('#rolePop');if(rp)rp.classList.remove('show');var up=$('#userPop');if(up)up.classList.remove('show');var qp=$('#quickPop');if(qp)qp.classList.remove('show');var qb=$('#quickBtn');if(qb)qb.classList.remove('open');}
 }
 else if((e.key==='/'||((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'))&&!typing){e.preventDefault();openPal();}
 else if(['1','2','3','4'].indexOf(e.key)>=0&&!typing){setRole(ROLE_ORDER[+e.key-1]);}
 else if(e.key==='.'&&!typing){cycle();}
});

/* ---- Themed select dropdown: replaces the OS-native option popup ---- */
var selCur=null,selWrap=null;
function closeSelPop(){var p=$('#selPop');if(p)p.classList.remove('show');if(selWrap){selWrap.classList.remove('open');var t=selWrap.querySelector('.sel-trigger');if(t)t.setAttribute('aria-expanded','false');}selCur=null;selWrap=null;}
function selLabel(sel){var s=sel.closest('.sel');if(!s)return;var t=s.querySelector('.sel-trigger .sel-lbl');var o=sel.options[sel.selectedIndex];if(t)t.textContent=o?o.text:'';}
function openSelPop(sel,wrap,trigger){
 closeSelPop();
 var pop=$('#selPop');if(!pop)return;
 selCur=sel;selWrap=wrap;wrap.classList.add('open');trigger.setAttribute('aria-expanded','true');
 pop.innerHTML=Array.prototype.map.call(sel.options,function(o,i){var on=i===sel.selectedIndex;
   return '<button type="button" role="option" data-si="'+i+'" aria-selected="'+on+'" class="'+(on?'on':'')+'"><span class="sel-opt">'+esc(o.text)+'</span>'+(on?'<span class="tickok">'+ic(P_CHECK,14)+'</span>':'')+'</button>';}).join('');
  pop.style.minWidth=Math.max(trigger.offsetWidth,190)+'px';
 pop.classList.add('show');
 var r=trigger.getBoundingClientRect(),pw=pop.offsetWidth,ph=pop.offsetHeight;
 pop.style.left=Math.max(10,Math.min(r.left,window.innerWidth-pw-10))+'px';
 var top=r.bottom+6;if(top+ph>window.innerHeight-10&&r.top-ph-6>10)top=r.top-ph-6;
 pop.style.top=top+'px';
 pop.querySelectorAll('[data-si]').forEach(function(b){b.onclick=function(e){e.stopPropagation();selPick(sel,+b.getAttribute('data-si'));};});
}
function selPick(sel,i){sel.selectedIndex=i;sel.dispatchEvent(new Event('change',{bubbles:true}));selLabel(sel);closeSelPop();}
function enhanceSelect(sel){
 if(sel.hasAttribute('data-enh')||sel.hasAttribute('data-no-enh'))return;sel.setAttribute('data-enh','');
 if(sel.multiple||sel.size>0)return;
 var inFilter=!!sel.closest('.filters'),inField=!!sel.closest('.field');
 var wrap=document.createElement('span');wrap.className='sel';
 sel.parentNode.insertBefore(wrap,sel);wrap.appendChild(sel);sel.tabIndex=-1;
 var trigger=document.createElement('button');
 trigger.type='button';
 trigger.className='sel-trigger'+(inFilter?' sel-skin-filters':inField?' sel-skin-field':'');
 trigger.setAttribute('aria-haspopup','listbox');trigger.setAttribute('aria-expanded','false');
 var aria=sel.getAttribute('aria-label');if(aria)trigger.setAttribute('aria-label',aria);
 trigger.innerHTML='<span class="sel-lbl"></span><span class="sel-chev">'+ic(P_CHEV,14)+'</span>';
 wrap.appendChild(trigger);
 selLabel(sel);
 sel.addEventListener('change',function(){selLabel(sel);});
 trigger.onclick=function(e){e.stopPropagation();if(wrap.classList.contains('open'))closeSelPop();else openSelPop(sel,wrap,trigger);};
}
function enhanceSelects(root){(root||document).querySelectorAll('select:not([data-enh])').forEach(enhanceSelect);}
document.addEventListener('click',function(e){if(selCur&&!e.target.closest('#selPop')&&!e.target.closest('.sel-trigger'))closeSelPop();});
window.addEventListener('resize',closeSelPop);
window.addEventListener('scroll',closeSelPop,true);
var selMO=new MutationObserver(function(muts){var hit=false;muts.forEach(function(m){Array.prototype.forEach.call(m.addedNodes,function(n){if(n.nodeType===1&&(n.tagName==='SELECT'||(n.querySelector&&n.querySelector('select'))))hit=true;});});if(hit)enhanceSelects(document);});
selMO.observe(document.body,{childList:true,subtree:true});
enhanceSelects(document);
(function(){
 var r=store.get('na3-role')||'soal';if(!ROLES[r])r='soal';
 var p='dashboard';
 try{var last=store.get('na3-last');if(last){var parts=String(last).split('|');if(parts[0]&&ROLES[parts[0]])r=parts[0];if(parts[1])p=parts[1];}}catch(_){}
 if(!F[p]&&p!=='dashboard'&&p!=='settings'&&p!=='profile')p='dashboard';
 state.role=r;state.page=p;
 state.chip='Semua';state.q='';state.fq={};state.sort=null;state.sortKey=null;state.showFilters=false;state.pg=1;state.sel={};state.tab='ringkas';
 loadFilters();
 load(function(){
  try{
   var cur=state.role+'|'+(state.page||defPage());
   var sk=store.get('na3-skey');var sy=parseInt(store.get('na3-sy')||'0',10);
   if(sk===cur&&sy>0)setTimeout(function(){window.scrollTo(0,sy);},50);
  }catch(_){}
 });
 syncChrome();
})();
</script>
